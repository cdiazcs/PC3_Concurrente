name: Verificar main - OpenAI Cubes PC3
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validar estructura y prediccion
        run: python scripts/check_main.py
      - name: Prueba TCP end-to-end heredada
        run: python scripts/smoke_main.py
      - name: Suite original de unitarios e integracion
        run: python -m unittest discover -s tests -p 'test_*.py' -v
